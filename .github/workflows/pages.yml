name: Deploy PixelPhyx to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy PixelPhyx
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - name: Build browser WebAssembly package
        run: wasm-pack build Website/wasm --target web --release --out-dir ../pkg
      - name: Validate browser JavaScript modules
        run: |
          for file in Website/js/*.js Website/js/netcode/*.js Website/pkg/*.js; do
            node --input-type=module --check < "$file"
          done
      - uses: actions/configure-pages@v5
      - name: Assemble Pages site
        run: |
          mkdir -p _site
          cp -a Website/. _site/
          mkdir -p _site/Offline
          cp Offline/*.html _site/Offline/
      - uses: actions/upload-pages-artifact@v3
        with:
          name: pixelphyx-pages
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: pixelphyx-pages

  build-offline:
    name: Build offline edition
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - name: Compile optimized WASM for the standalone offline edition
        run: wasm-pack build Website/wasm --target web --release --out-dir ../pkg
      - name: Generate standalone offline edition
        run: node Offline/build-offline.mjs
      - name: Commit generated offline edition
        run: |
          if [ -z "$(git status --porcelain -- Offline/offline.html)" ]; then
            echo "Offline/offline.html is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+Jack105WA@users.noreply.github.com"
          git add Offline/offline.html
          git commit -m "[skip ci] Build offline edition"
          git push
