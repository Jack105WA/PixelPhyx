name: PixelPhyx workflows
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy-live:
    needs: build-offline
    if: github.ref == 'refs/heads/main'
    name: Deploy production
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out production
        uses: actions/checkout@v4
        with:
          ref: main
          path: production
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - name: Build optimized Photon WebAssembly package
        run: wasm-pack build production/Website/wasm --target web --release --out-dir ../pkg
      - name: Validate Photon JavaScript modules
        run: |
          for file in production/Website/js/*.js production/Website/js/netcode/*.js production/Website/pkg/*.js; do
            node --input-type=module --check < "$file"
          done
      - uses: actions/configure-pages@v5
      - name: Assemble combined Pages site
        run: |
          mkdir -p _site
          cp -a production/Website/. _site/
          mkdir -p _site/Offline
          cp production/Offline/*.html _site/Offline/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

  build-offline:
    name: Build offline edition
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - name: Compile optimized WASM for the standalone offline edition
        run: wasm-pack build Website/wasm --target web --release --out-dir ../pkg
      - name: Generate standalone offline edition
        run: node Offline/build-offline.mjs
      - name: Commit generated offline edition
        run: |
          if [ -z "$(git status --porcelain -- Offline/offline.html)" ]; then
            echo "Offline/offline.html is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+Jack105WA@users.noreply.github.com"
          git add Offline/offline.html
          git commit -m "[skip ci] Build offline edition"
          git push
