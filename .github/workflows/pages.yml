name: PixelPhyx workflows
on:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

# Keep each push's deployment and offline build together.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-live:
    name: Deploy live website
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: Website
      - id: deployment
        uses: actions/deploy-pages@v4

  build-offline:
    name: Build offline edition
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate standalone offline edition
        run: node Offline/build-offline.mjs
      - name: Commit generated offline edition
        run: |
          if [ -z "$(git status --porcelain -- Website/offline.html)" ]; then
            echo "Website/offline.html is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Website/offline.html
          git commit -m "[skip ci] Build offline edition"
          git push
