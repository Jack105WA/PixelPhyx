name: Deploy PixelPhyx to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, validate and deploy PixelPhyx
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Compile TypeScript sources
        run: |
          npx --yes --package typescript@5.9.3 tsc -p Website/tsconfig.json
          npx --yes --package typescript@5.9.3 tsc -p Server/tsconfig.json

      - name: Validate browser JavaScript modules
        run: |
          set -e
          for file in Website/js/*.js Website/js/netcode/*.js Website/pkg/*.js; do
            node --input-type=module --check < "$file"
          done

      - uses: actions/configure-pages@v5

      - name: Assemble Pages site from the same build
        run: |
          set -e
          mkdir -p _site
          cp -a Website/. _site/
          # Assets live at the repository root, outside Website/.
          cp -a assets _site/assets
          mkdir -p _site/Offline
          cp Offline/*.html _site/Offline/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site/

      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
