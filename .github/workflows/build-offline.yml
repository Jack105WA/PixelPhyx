name: Build offline edition

on:
  push:
    branches: [main]
    paths:
      - "js/main.js"
      - "js/material-physics.js"
      - "build-offline.mjs"
      - ".github/workflows/build-offline.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: offline-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rebuild standalone offline HTML
        run: node build-offline.mjs

      - name: Commit updated offline edition
        run: |
          if git diff --quiet -- offline.html; then
            echo "offline.html is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add offline.html
          git commit -m "Build updated offline edition"
          git push
