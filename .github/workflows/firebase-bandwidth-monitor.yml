name: Firebase bandwidth monitor

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-bandwidth-monitor
  cancel-in-progress: false

jobs:
  update-bandwidth:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Update Firebase bandwidth status
        env:
          GOOGLE_CLOUD_PROJECT: pixelphyx-backendv2
          FIREBASE_DATABASE_URL: https://pixelphyx-backendv2-default-rtdb.firebaseio.com
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: node firebase-bandwidth-monitor.mjs
