name: Build standalone offline edition

on:
  push:
    branches: [main]
    paths:
      - "Website/js/**"
      - "Website/pkg/**"
      - "Offline/build-offline.mjs"
      - ".github/workflows/offline-build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pixelphyx-offline-build
  cancel-in-progress: true

jobs:
  build:
    name: Build and validate offline edition
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build offline edition
        run: |
          node --check Offline/build-offline.mjs
          node Offline/build-offline.mjs
          test -s Offline/offline.html
          ! grep -Eiq 'pixelphyx-offline-updater|raw.githubusercontent.com' Offline/offline.html
          ! grep -Eiq '<script[^>]+src=' Offline/offline.html

      - name: Commit generated offline edition
        run: |
          if [ -z "$(git status --porcelain -- Offline/offline.html)" ]; then
            echo "Offline edition is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+Jack105WA@users.noreply.github.com"
          git add Offline/offline.html
          git commit -m "[skip ci] Build offline edition"
          git push origin HEAD:main
